# Verifies dqi-finite-size on its own: checks out only that folder, so it cannot depend on anything else.
# Paper rebuilds live in dqi-finite-size-paper.yml, so a paper-only or docs-only change does not run these jobs.
name: dqi-finite-size

on:
  push:
    branches: [main]
    paths: ["dqi-finite-size/**", "!dqi-finite-size/paper/**", "!dqi-finite-size/**.md", ".github/workflows/dqi-finite-size.yml"]
  pull_request:
    paths: ["dqi-finite-size/**", "!dqi-finite-size/paper/**", "!dqi-finite-size/**.md", ".github/workflows/dqi-finite-size.yml"]
  schedule:
    - cron: "17 6 * * 1"   # weekly re-verification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: dqi-finite-size

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: dqi-finite-size
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dqi-finite-size/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: ./verify.sh quick

  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: dqi-finite-size
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dqi-finite-size/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: ./verify.sh reproduce
