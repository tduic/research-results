# Verifies dqi-finite-size on its own: checks out only that folder, so it cannot depend on anything else.
name: dqi-finite-size

on:
  push:
    paths: ["dqi-finite-size/**", ".github/workflows/dqi-finite-size.yml"]
  pull_request:
    paths: ["dqi-finite-size/**", ".github/workflows/dqi-finite-size.yml"]
  schedule:
    - cron: "17 6 * * 1"   # weekly re-verification
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: dqi-finite-size

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: dqi-finite-size
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dqi-finite-size/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: ./verify.sh quick

  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: dqi-finite-size
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dqi-finite-size/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: ./verify.sh reproduce

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: dqi-finite-size
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install LaTeX
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science latexmk poppler-utils
      - run: ./verify.sh paper
