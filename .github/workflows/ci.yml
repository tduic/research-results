name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy scipy mpmath pytest
      - name: Run tests
        run: python -m pytest -q tests
      - name: Independent trifference re-check
        run: cd trifferent-codes && python3 -I verification/rt_check.py .

  papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science latexmk
      - name: Build every paper
        run: |
          for paper in */paper; do
            echo "::group::$paper"
            (cd "$paper" && latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex)
            if grep -E "undefined|Citation .* undefined|Reference .* undefined" "$paper/main.log"; then exit 1; fi
            echo "::endgroup::"
          done

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        working-directory: trifferent-codes/lean
        run: lake exe cache get
      - name: Build proofs (one module at a time)
        working-directory: trifferent-codes/lean
        run: ./ci-build.sh 2>&1 | tee build.log
      - name: Check axioms
        working-directory: trifferent-codes/lean
        run: |
          grep "depends on axioms" build.log
          if grep "depends on axioms" build.log | grep -v "\[propext, Classical.choice, Quot.sound\]"; then exit 1; fi
          test "$(grep -c 'depends on axioms' build.log)" -ge 6
