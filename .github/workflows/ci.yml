name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy scipy mpmath pytest
      - name: Run tests
        run: python -m pytest -q tests
      - name: Independent trifference re-check
        run: cd trifferent-codes && python3 -I verification/rt_check.py .

  papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install LaTeX
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science latexmk poppler-utils
      - name: Build every paper and check the committed PDFs are current
        run: |
          for paper in */paper; do
            echo "::group::$paper"
            cp "$paper/main.pdf" "$RUNNER_TEMP/committed.pdf"
            (cd "$paper" && latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex)
            if grep -E "undefined|Rerun to get" "$paper/main.log"; then exit 1; fi
            pdftotext -layout "$RUNNER_TEMP/committed.pdf" "$RUNNER_TEMP/committed.txt"
            pdftotext -layout "$paper/main.pdf" "$RUNNER_TEMP/built.txt"
            if ! cmp -s "$RUNNER_TEMP/committed.txt" "$RUNNER_TEMP/built.txt"; then
              echo "::error::$paper/main.pdf does not match its source; rebuild and commit it"
              diff "$RUNNER_TEMP/committed.txt" "$RUNNER_TEMP/built.txt" | head -40
              exit 1
            fi
            echo "::endgroup::"
          done
      - name: Build arXiv source bundles (standalone pdflatex, no BibTeX)
        run: python3 tools/make_arxiv.py
      - uses: actions/upload-artifact@v7
        with:
          name: arxiv-bundles
          path: |
            dist/*-arxiv.tar.gz
            dist/*-arxiv-metadata.txt
            dist/*-arxiv-preview.pdf

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        working-directory: trifferent-codes/lean
        run: lake exe cache get
      - name: Build proofs (one module at a time)
        working-directory: trifferent-codes/lean
        run: ./ci-build.sh 2>&1 | tee build.log
      - name: Check axioms
        working-directory: trifferent-codes/lean
        run: |
          grep "depends on axioms" build.log
          if grep "depends on axioms" build.log | grep -v "\[propext, Classical.choice, Quot.sound\]"; then exit 1; fi
          test "$(grep -c 'depends on axioms' build.log)" -ge 6
