# Verifies trifferent-codes on its own: checks out only that folder, so it cannot depend on anything else.
# The Lean build has its own workflow (trifferent-codes-lean.yml) so that edits elsewhere do not rebuild it.
# The paper rebuild has its own workflow (trifferent-codes-paper.yml) so that a paper-only or docs-only change does not run this job.
name: trifferent-codes

on:
  push:
    branches: [main]
    paths: ["trifferent-codes/**", "!trifferent-codes/paper/**", "!trifferent-codes/**.md", ".github/workflows/trifferent-codes.yml"]
  pull_request:
    paths: ["trifferent-codes/**", "!trifferent-codes/paper/**", "!trifferent-codes/**.md", ".github/workflows/trifferent-codes.yml"]
  schedule:
    - cron: "23 6 * * 1"   # weekly re-verification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: trifferent-codes

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: trifferent-codes
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: trifferent-codes/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: ./verify.sh quick
